<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 需求彙整</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      padding: 40px;
      width: 100%;
      max-width: 480px;
    }

    h1 {
      font-size: 1.5rem;
      color: #1a202c;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #718096;
      font-size: 0.9rem;
      margin-bottom: 32px;
    }

    .field { margin-bottom: 20px; }

    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      color: #2d3748;
      margin-bottom: 6px;
    }

    input, textarea {
      width: 100%;
      border: 1.5px solid #e2e8f0;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 1rem;
      color: #2d3748;
      transition: border-color 0.2s;
      outline: none;
      font-family: inherit;
    }

    input:focus, textarea:focus {
      border-color: #4f7cff;
      box-shadow: 0 0 0 3px rgba(79,124,255,0.12);
    }

    textarea { resize: vertical; min-height: 120px; }

    button {
      width: 100%;
      background: #4f7cff;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    button:hover:not(:disabled) { background: #3a66e8; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }

    .spinner {
      width: 18px; height: 18px;
      border: 2.5px solid rgba(255,255,255,0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .result {
      margin-top: 24px;
      padding: 16px;
      border-radius: 8px;
      font-size: 0.95rem;
      line-height: 1.6;
      display: none;
    }

    .result.success {
      background: #f0fff4;
      border: 1.5px solid #9ae6b4;
      color: #276749;
    }

    .result.error {
      background: #fff5f5;
      border: 1.5px solid #fed7d7;
      color: #c53030;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>AI 需求彙整</h1>
    <p class="subtitle">填寫您的姓名與需求，AI 將為您彙整回覆</p>

    <div class="field">
      <label for="name">姓名</label>
      <input type="text" id="name" placeholder="請輸入姓名" autocomplete="off">
    </div>

    <div class="field">
      <label for="request">需求說明</label>
      <textarea id="request" placeholder="請描述您的需求..."></textarea>
    </div>

    <button id="submitBtn" onclick="handleSubmit()">
      <span class="spinner" id="spinner"></span>
      <span id="btnText">送出</span>
    </button>

    <div class="result" id="result"></div>
  </div>

  <script>
    // ↓ 把這裡換成你的 n8n webhook URL
    const N8N_WEBHOOK_URL = 'https://classtest.flyinmoon0217.workers.dev';

    async function handleSubmit() {
      const name = document.getElementById('name').value.trim();
      const request = document.getElementById('request').value.trim();
      const resultEl = document.getElementById('result');
      const btn = document.getElementById('submitBtn');
      const spinner = document.getElementById('spinner');
      const btnText = document.getElementById('btnText');

      if (!name || !request) {
        showResult('error', '請填寫姓名與需求後再送出。');
        return;
      }

      // 送出中狀態
      btn.disabled = true;
      spinner.style.display = 'block';
      btnText.textContent = '處理中...';
      resultEl.style.display = 'none';

      try {
        const res = await fetch(N8N_WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, request }),
        });

        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        const data = await res.json();

        // n8n 回傳的內容，依你的 workflow 輸出調整欄位名稱
        const reply = data.reply ?? data.output ?? data.message ?? JSON.stringify(data);
        showResult('success', reply);
      } catch (err) {
        showResult('error', `送出失敗：${err.message}`);
      } finally {
        btn.disabled = false;
        spinner.style.display = 'none';
        btnText.textContent = '送出';
      }
    }

    function showResult(type, text) {
      const el = document.getElementById('result');
      el.className = `result ${type}`;
      el.textContent = text;
      el.style.display = 'block';
    }
  </script>
</body>
</html>
